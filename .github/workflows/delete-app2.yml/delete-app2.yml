name: Delete app2
on:
  workflow_dispatch:
jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove app2 directory
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git rm -r app2/
          git commit -m "Remove app2 directory"
          git push
