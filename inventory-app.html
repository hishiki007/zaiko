<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>部品在庫管理</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #2563eb; --primary-dark: #1d4ed8;
  --success: #16a34a; --danger: #dc2626; --warning: #d97706;
  --bg: #f1f5f9; --card: #fff; --border: #e2e8f0;
  --text: #1e293b; --muted: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); }

header { background: var(--primary); color: white; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
header h1 { font-size: 16px; font-weight: 700; }
.header-right { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #86efac; box-shadow: 0 0 6px #86efac; }
.dot.off { background: #fca5a5; box-shadow: none; }

.btn { padding: 8px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: white; }
.btn-warning { background: var(--warning); color: white; }
.btn-outline { background: white; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--bg); }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ghost { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
.btn-ghost:hover { background: rgba(255,255,255,0.25); }

#setup { max-width: 500px; margin: 40px auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.card h2 { font-size: 18px; margin-bottom: 8px; }
.card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.6; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.field input, .field select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: white; }
.field input:focus, .field select:focus { border-color: var(--primary); }
.err { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

#app { display: none; }

.toolbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search { flex: 1; min-width: 150px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
.search:focus { border-color: var(--primary); }

.loc-tabs { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; overflow-x: auto; }
.loc-tab { padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); white-space: nowrap; transition: all 0.15s; }
.loc-tab:hover { color: var(--text); }
.loc-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.loc-tab .cnt { background: var(--bg); padding: 1px 7px; border-radius: 999px; font-size: 11px; margin-left: 5px; }
.loc-tab.active .cnt { background: #dbeafe; color: var(--primary); }

.table-wrap { padding: 16px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
th { background: #f8fafc; padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8fafc; }
.acts { display: flex; gap: 5px; flex-wrap: wrap; }
.qty-cell { font-weight: 700; font-size: 15px; }
.zero { color: #cbd5e1; }
.loc-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.loc-chip { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
.loc-chip.has { background: #dcfce7; border-color: #86efac; color: var(--success); font-weight: 600; }

/* Part photo thumbnail */
.part-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
.part-thumb-none { width: 40px; height: 40px; border-radius: 6px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--border); }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty .ico { font-size: 40px; margin-bottom: 10px; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; padding: 16px; }
.overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--card); border-radius: 12px; padding: 24px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); transform: translateY(16px); transition: transform 0.2s; max-height: 90vh; overflow-y: auto; }
.overlay.open .modal { transform: translateY(0); }
.modal h3 { font-size: 17px; margin-bottom: 18px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Photo upload area */
.photo-area { border: 2px dashed var(--border); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; transition: border-color 0.2s; margin-bottom: 4px; }
.photo-area:hover { border-color: var(--primary); }
.photo-area img { max-width: 100%; max-height: 160px; border-radius: 8px; object-fit: contain; }
.photo-area .ph-hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
.photo-area .ph-icon { font-size: 32px; }

/* Transfer */
.transfer-preview { background: var(--bg); border-radius: 8px; padding: 12px; font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }

/* History panel (global) */
#hist-panel { position: fixed; right: 0; top: 56px; bottom: 0; width: 320px; background: var(--card); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform 0.3s; z-index: 150; display: flex; flex-direction: column; }
#hist-panel.open { transform: translateX(0); }
.panel-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
.panel-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
.hist-list { overflow-y: auto; flex: 1; padding: 10px; }
.hi { padding: 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); font-size: 12px; }
.hi-top { display: flex; justify-content: space-between; margin-bottom: 3px; }
.hi-name { font-weight: 600; font-size: 13px; }
.hi-time { color: var(--muted); font-size: 11px; }
.hi-detail { color: var(--muted); }
.hi-move { border-left: 3px solid var(--warning); }
.hi-add { border-left: 3px solid var(--primary); }
.hi-edit { border-left: 3px solid var(--muted); }
.hi-del { border-left: 3px solid #94a3b8; }
.hi-in { border-left: 3px solid var(--success); }
.hi-out { border-left: 3px solid var(--danger); }

/* Part history modal */
.part-hist-item { padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); font-size: 13px; }
.part-hist-item .phi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.part-hist-item .phi-type { font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
.type-in { background: #dcfce7; color: var(--success); }
.type-out { background: #fee2e2; color: var(--danger); }
.type-move { background: #fef3c7; color: var(--warning); }
.type-add { background: #dbeafe; color: var(--primary); }
.type-edit { background: #f1f5f9; color: var(--muted); }
.type-del { background: #f1f5f9; color: var(--muted); }
.type-set { background: #ede9fe; color: #7c3aed; }
.phi-detail { color: var(--muted); font-size: 12px; }

/* Image lightbox */
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#lightbox.open { opacity: 1; pointer-events: all; }
#lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 10px; object-fit: contain; }
#lightbox-close { position: absolute; top: 16px; right: 20px; color: white; font-size: 28px; cursor: pointer; }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.3s; z-index: 300; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; }

@media (max-width: 600px) {
  .toolbar { padding: 8px 12px; }
  .table-wrap { padding: 10px 12px 16px; }
  #hist-panel { width: 100%; }
}
</style>
</head>
<body>

<header>
  <h1>🔧 部品在庫管理</h1>
  <div class="header-right">
    <span class="dot" id="dot"></span>
    <button class="btn btn-ghost btn-sm" onclick="toggleHist()">全履歴</button>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">設定</button>
  </div>
</header>

<!-- Setup -->
<div id="setup">
  <div class="card">
    <h2>🔥 Firebase 設定</h2>
    <p>接続情報を入力してください。5人で同じ情報を使えばリアルタイム共有できます。</p>
    <div class="field"><label>API Key</label><input id="f-key" placeholder="AIzaSy..." /></div>
    <div class="field"><label>Auth Domain</label><input id="f-auth" placeholder="xxx.firebaseapp.com" /></div>
    <div class="field"><label>Database URL</label><input id="f-db" placeholder="https://xxx.firebasedatabase.app" /></div>
    <div class="field"><label>Project ID</label><input id="f-pid" placeholder="your-project-id" /></div>
    <button class="btn btn-primary" style="width:100%;padding:11px;margin-top:4px;" onclick="connect()">接続して開始 →</button>
    <p class="err" id="setup-err"></p>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="🔍 部品名・部品番号で検索..." oninput="render()" />
    <button class="btn btn-primary" onclick="openAdd()">＋ 部品追加</button>
    <button class="btn btn-warning" onclick="openTransfer()">↔ 移動</button>
    <button class="btn btn-outline" onclick="exportCSV()">CSV出力</button>
    <button class="btn btn-outline" onclick="exportExcel()">Excel出力</button>
    <label class="btn btn-outline" for="csv-import-input" style="cursor:pointer;">📥 CSVインポート</label>
    <input type="file" id="csv-import-input" accept=".csv" style="display:none" onchange="handleCSVImport(event)" />
  </div>

  <div class="loc-tabs">
    <div class="loc-tab active" data-loc="all" onclick="setLocTab(this,'all')">すべて<span class="cnt" id="cnt-all">0</span></div>
    <div class="loc-tab" data-loc="シンワ倉庫" onclick="setLocTab(this,'シンワ倉庫')">シンワ倉庫<span class="cnt" id="cnt-0">0</span></div>
    <div class="loc-tab" data-loc="アラン" onclick="setLocTab(this,'アラン')">アラン<span class="cnt" id="cnt-1">0</span></div>
    <div class="loc-tab" data-loc="ゆーや" onclick="setLocTab(this,'ゆーや')">ゆーや<span class="cnt" id="cnt-2">0</span></div>
    <div class="loc-tab" data-loc="しゅん" onclick="setLocTab(this,'しゅん')">しゅん<span class="cnt" id="cnt-3">0</span></div>
    <div class="loc-tab" data-loc="たくや" onclick="setLocTab(this,'たくや')">たくや<span class="cnt" id="cnt-4">0</span></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>部品番号</th>
          <th>部品名</th>
          <th id="th-loc">保管場所 / 数量</th>
          <th>合計</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- CSV Import Modal -->
<div class="overlay" id="ov-csv" onclick="closeOv('ov-csv',event)">
  <div class="modal" style="max-width:500px;">
    <h3>📥 CSVインポート確認</h3>
    <div id="csv-preview" style="background:var(--bg);border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px;"></div>
    <div style="background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:12px;font-size:13px;color:#92400e;margin-bottom:16px;">
      ⚠️ 既存の部品データは<strong>上書き</strong>されます。新規追加のみの場合は既存データはそのままです。
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeOv('ov-csv')">キャンセル</button>
      <button class="btn btn-primary" id="csv-import-btn" onclick="doCSVImport()">インポート実行</button>
    </div>
  </div>
</div>

<!-- Global History Panel -->
<div id="hist-panel">
  <div class="panel-head">
    <span>全操作履歴</span>
    <button class="panel-close" onclick="toggleHist()">✕</button>
  </div>
  <div class="hist-list" id="hist-list"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="ov-part" onclick="closeOv('ov-part',event)">
  <div class="modal">
    <h3 id="part-title">部品を追加</h3>
    <input type="hidden" id="p-key" />


    <div class="row2">
      <div class="field"><label>部品番号</label><input id="p-no" placeholder="例: P-001" /></div>
      <div class="field"><label>部品名 *</label><input id="p-name" placeholder="例: ボルト M6" /></div>
    </div>
    <div style="margin-top:4px;">
      <p style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px;" id="loc-label">各保管場所の初期数量</p>
      <div class="row2" id="loc-inputs"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeOv('ov-part')">キャンセル</button>
      <button class="btn btn-primary" onclick="savePart()">保存</button>
    </div>
  </div>
</div>

<!-- Transfer Modal -->
<div class="overlay" id="ov-transfer" onclick="closeOv('ov-transfer',event)">
  <div class="modal">
    <h3>↔ 部品を移動</h3>
    <div class="field">
      <label>部品番号または部品名</label>
      <input type="text" id="tr-part-input" placeholder="例: P-001 または ボルト" oninput="searchTrPart()" autocomplete="off" list="tr-part-list" />
      <datalist id="tr-part-list"></datalist>
      <input type="hidden" id="tr-part" />
      <div id="tr-part-name" style="font-size:12px;color:var(--success);margin-top:4px;font-weight:600;"></div>
    </div>
    <div class="row2">
      <div class="field"><label>移動元</label>
        <select id="tr-from" onchange="updateTrPreview()">
          <option value="">選択...</option>
          <option>シンワ倉庫</option><option>アラン</option><option>ゆーや</option><option>しゅん</option><option>たくや</option>
        </select>
      </div>
      <div class="field"><label>移動先</label>
        <select id="tr-to" onchange="updateTrPreview()">
          <option value="">選択...</option>
          <option>シンワ倉庫</option><option>アラン</option><option>ゆーや</option><option>しゅん</option><option>たくや</option>
        </select>
      </div>
    </div>
    <div class="field"><label>移動数量</label>
      <input type="number" id="tr-qty" value="1" min="1" style="font-size:20px;text-align:center;padding:10px;" oninput="updateTrPreview()" />
    </div>
    <div class="transfer-preview" id="tr-preview">移動元と移動先を選択してください</div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeOv('ov-transfer')">キャンセル</button>
      <button class="btn btn-warning" onclick="doTransfer()">移動を実行</button>
    </div>
  </div>
</div>

<!-- Stock Change Modal -->
<div class="overlay" id="ov-stock" onclick="closeOv('ov-stock',event)">
  <div class="modal">
    <h3 id="stock-title">在庫を変更</h3>
    <input type="hidden" id="sk-key" />
    <div class="field"><label>保管場所</label>
      <select id="sk-loc" onchange="updateSkPreview()">
        <option>シンワ倉庫</option><option>アラン</option><option>ゆーや</option><option>しゅん</option><option>たくや</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="btn" id="sk-btn-in" style="flex:1;background:#dcfce7;color:var(--success);border:2px solid var(--success);" onclick="setSkMode('in')">📥 入庫</button>
      <button class="btn" id="sk-btn-out" style="flex:1;border:2px solid var(--border);" onclick="setSkMode('out')">📤 出庫</button>
      <button class="btn" id="sk-btn-set" style="flex:1;border:2px solid var(--border);" onclick="setSkMode('set')">✏️ 直接指定</button>
    </div>
    <div class="field"><label id="sk-qty-label">入庫数量</label>
      <input type="number" id="sk-qty" value="1" min="0" style="font-size:20px;text-align:center;padding:10px;" oninput="updateSkPreview()" />
    </div>
    <div class="transfer-preview" id="sk-preview"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeOv('ov-stock')">キャンセル</button>
      <button class="btn btn-success" onclick="doStockChange()">確定</button>
    </div>
  </div>
</div>

<!-- Part History Modal -->
<div class="overlay" id="ov-phist" onclick="closeOv('ov-phist',event)">
  <div class="modal" style="max-width:500px;">
    <h3 id="phist-title">📋 変更履歴</h3>
    <div id="phist-body" style="max-height:60vh;overflow-y:auto;"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="openPartKey=null;closeOv('ov-phist')">閉じる</button>
    </div>
  </div>
</div>

<!-- Image Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span id="lightbox-close">✕</span>
  <img id="lightbox-img" src="" alt="" />
</div>

<div id="toast"></div>


<script>
const LOCS = ['シンワ倉庫','アラン','ゆーや','しゅん','たくや'];
const TYPE_LABELS = { move:'移動', add:'追加', edit:'編集', del:'削除', in:'入庫', out:'出庫', set:'直接指定' };
let db=null, parts={}, hist=[];
let curLoc='all', skMode='in';
let partHistRef=null;
let openPartKey=null; // 履歴モーダルで表示中の部品キー

// ── Firebase ──
function connect() {
  if(typeof firebase==='undefined'){ showErr('Firebase読み込み中です。少し待ってから再度押してください。'); return; }
  const cfg = { apiKey:id('f-key').value.trim(), authDomain:id('f-auth').value.trim(), databaseURL:id('f-db').value.trim(), projectId:id('f-pid').value.trim() };
  if (!cfg.apiKey||!cfg.databaseURL||!cfg.projectId) { showErr('API Key、Database URL、Project ID は必須です'); return; }
  localStorage.setItem('inv_cfg', JSON.stringify(cfg));
  initFB(cfg);
}
function initFB(cfg) {
  try {
    if (firebase.apps.length) firebase.app().delete().catch(()=>{});
    firebase.initializeApp(cfg);
    db = firebase.database();
    db.ref('.info/connected').on('value', s => { id('dot').className='dot'+(s.val()?'':' off'); });
    db.ref('parts').on('value', s => { parts=s.val()||{}; render(); updateTabs(); fillTrParts(); });
    db.ref('history').limitToLast(100).on('child_added', s => {
      const v=s.val(); hist.unshift(v); if(hist.length>100) hist.pop();
      renderHist(); if(openPartKey) renderPartHistModal();
    });
    id('setup').style.display='none';
    id('app').style.display='block';
  } catch(e) { showErr('接続エラー: '+e.message); }
}
function doLogout() { if(confirm('設定画面に戻りますか？')){localStorage.removeItem('inv_cfg');location.reload();} }
function tryAutoConnect(){
  const saved=localStorage.getItem('inv_cfg');
  if(!saved) return;
  try{
    const c=JSON.parse(saved);
    id('f-key').value=c.apiKey||'';
    id('f-auth').value=c.authDomain||'';
    id('f-db').value=c.databaseURL||'';
    id('f-pid').value=c.projectId||'';
    if(typeof firebase==='undefined'){
      // Firebaseがまだ読み込まれていない場合は少し待ってリトライ
      setTimeout(tryAutoConnect, 300);
      return;
    }
    initFB(c);
  }catch(e){}
}
tryAutoConnect();

// ── Tabs ──
function setLocTab(el,loc){document.querySelectorAll('.loc-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');curLoc=loc;id('th-loc').textContent=loc==='all'?'保管場所 / 数量':loc+' の数量';render();}
function updateTabs(){
  id('cnt-all').textContent=Object.keys(parts).length;
  LOCS.forEach((l,i)=>{ id('cnt-'+i).textContent=Object.values(parts).filter(p=>p.locs&&(p.locs[l]||0)>0).length; });
}

// ── Render ──
function render(){
  const q=id('q').value.toLowerCase();
  let rows=Object.entries(parts).map(([k,p])=>({k,...p}));
  if(curLoc!=='all') rows=rows.filter(r=>r.locs&&(r.locs[curLoc]||0)>0);
  if(q) rows=rows.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.no||'').toLowerCase().includes(q));
  const tbody=id('tbody');
  if(!rows.length){tbody.innerHTML=`<tr><td colspan="6"><div class="empty"><div class="ico">🔧</div><p>部品が見つかりません</p></div></td></tr>`;return;}
  tbody.innerHTML=rows.map(r=>{
    const locs=r.locs||{};
    const total=LOCS.reduce((s,l)=>s+(locs[l]||0),0);
    const locCell=curLoc==='all'
      ?`<div class="loc-chips">${LOCS.map(l=>`<span class="loc-chip ${(locs[l]||0)>0?'has':''}">${l}: ${locs[l]||0}</span>`).join('')}</div>`
      :`<span class="qty-cell ${(locs[curLoc]||0)===0?'zero':''}">${locs[curLoc]||0}</span>`;
    return `<tr>
      <td style="font-family:monospace;font-size:12px;color:var(--muted);">${esc(r.no||'—')}</td>
      <td style="font-weight:600;">${esc(r.name||'')}</td>
      <td>${locCell}</td>
      <td><span class="qty-cell ${total===0?'zero':''}">${total}</span></td>
      <td><div class="acts">
        <button class="btn btn-outline btn-sm" onclick="openStock('${r.k}')">在庫変更</button>
        <button class="btn btn-outline btn-sm" onclick="openPartHist('${r.k}')">📋 履歴</button>
        <button class="btn btn-outline btn-sm" onclick="openEdit('${r.k}')">編集</button>
        <button class="btn btn-sm" style="color:var(--danger);border:1px solid var(--border);background:white;" onclick="delPart('${r.k}','${esc(r.name||'')}')">削除</button>
      </div></td>
    </tr>`;
  }).join('');
}


// ── Add/Edit ──
function openAdd(){
  id('part-title').textContent='部品を追加'; id('p-key').value=''; id('p-no').value=''; id('p-name').value='';
  id('loc-label').textContent='各保管場所の初期数量';
  buildLocInputs({});
  open_('ov-part');
}
function openEdit(key){
  const p=parts[key]; if(!p)return;
  id('part-title').textContent='部品を編集'; id('p-key').value=key; id('p-no').value=p.no||''; id('p-name').value=p.name||'';
  id('loc-label').textContent='※ 在庫数の変更は「在庫変更」ボタンから';
  buildLocInputs(p.locs||{}, true);
  open_('ov-part');
}
function buildLocInputs(locs,disabled=false){
  id('loc-inputs').innerHTML=LOCS.map(l=>`<div class="field"><label>${l}</label><input type="number" min="0" value="${locs[l]||0}" id="li-${l}" ${disabled?'disabled style="background:#f8fafc;color:var(--muted);"':''}/></div>`).join('');
}
function savePart(){
  const name=id('p-name').value.trim(); if(!name){toast('部品名は必須です');return;}
  const key=id('p-key').value;
  const data={no:id('p-no').value.trim(), name, updatedAt:Date.now()};
  if(key){
    db.ref('parts/'+key).update(data);
    addHist('edit',key,name,'情報を更新');
    toast('✅ 更新しました');
  } else {
    const locs={}; LOCS.forEach(l=>{locs[l]=parseInt(id('li-'+l).value)||0;});
    data.locs=locs; data.createdAt=Date.now();
    const ref=db.ref('parts').push(); ref.set(data);
    addHist('add',ref.key,name,'新規登録 '+LOCS.map(l=>`${l}:${locs[l]}`).join(' '));
    toast('✅ 追加しました');
  }
  closeOv('ov-part');
}
function delPart(key,name){
  if(!confirm(`「${name}」を削除しますか？`))return;
  addHist('del',key,name,'削除');
  db.ref('parts/'+key).remove();
  toast('🗑 削除しました');
}

// ── Stock ──
function openStock(key){
  const p=parts[key]; if(!p)return;
  id('sk-key').value=key; id('stock-title').textContent=p.name; id('sk-qty').value=1;
  setSkMode('in'); updateSkPreview(); open_('ov-stock');
}
function setSkMode(mode){
  skMode=mode;
  const styles={in:['#dcfce7','var(--success)','var(--success)'],out:['white','var(--text)','var(--danger)'],set:['white','var(--text)','var(--primary)']};
  ['in','out','set'].forEach(m=>{const b=id('sk-btn-'+m);b.style.background=m===mode?styles[m][0]:'white';b.style.color=m===mode?styles[m][1]:'var(--text)';b.style.borderColor=m===mode?styles[m][2]:'var(--border)';});
  id('sk-qty-label').textContent=mode==='set'?'在庫数（直接指定）':mode==='in'?'入庫数量':'出庫数量';
  updateSkPreview();
}
function updateSkPreview(){
  const key=id('sk-key').value; if(!key||!parts[key])return;
  const loc=id('sk-loc').value, cur=(parts[key].locs||{})[loc]||0, qty=parseInt(id('sk-qty').value)||0;
  const after=skMode==='in'?cur+qty:skMode==='out'?Math.max(0,cur-qty):qty;
  id('sk-preview').textContent=`${loc}: ${cur} → ${after}`;
}
function doStockChange(){
  const key=id('sk-key').value; const p=parts[key]; if(!p)return;
  const loc=id('sk-loc').value, cur=(p.locs||{})[loc]||0, qty=parseInt(id('sk-qty').value)||0;
  const nv=skMode==='in'?cur+qty:skMode==='out'?Math.max(0,cur-qty):qty;
  const upd={}; upd[`parts/${key}/locs/${loc}`]=nv; upd[`parts/${key}/updatedAt`]=Date.now();
  db.ref().update(upd);
  const label=skMode==='in'?'入庫':skMode==='out'?'出庫':'直接指定';
  addHist(skMode==='in'?'in':skMode==='out'?'out':'set',key,p.name,`${label} ${loc}: ${cur}→${nv}`);
  toast(`✅ ${loc}: ${nv}`);
  closeOv('ov-stock');
}

// ── Transfer ──
function fillTrParts(){
  // datalistを更新
  const dl=id('tr-part-list');
  dl.innerHTML=Object.entries(parts).map(([k,p])=>
    `<option value="${esc(p.no||'')} - ${esc(p.name||'')}" data-key="${k}">`
  ).join('');
}
function searchTrPart(){
  const q=id('tr-part-input').value.trim().toLowerCase();
  id('tr-part').value='';
  id('tr-part-name').textContent='';
  if(!q){updateTrPreview();return;}
  // 部品番号または部品名で一致するものを探す
  const match=Object.entries(parts).find(([k,p])=>
    (p.no||'').toLowerCase()===q ||
    (p.no+' - '+p.name).toLowerCase()===q ||
    (p.name||'').toLowerCase()===q ||
    (p.no||'').toLowerCase().startsWith(q)
  );
  if(match){
    id('tr-part').value=match[0];
    id('tr-part-name').textContent=`✅ ${match[1].no||''} ${match[1].name}`;
  }
  updateTrPreview();
}
function openTransfer(){
  id('tr-part-input').value='';
  id('tr-part').value='';
  id('tr-part-name').textContent='';
  id('tr-from').value='';
  id('tr-to').value='';
  id('tr-qty').value=1;
  id('tr-preview').textContent='部品・移動元・移動先を選択してください';
  open_('ov-transfer');
}
function updateTrPreview(){
  const key=id('tr-part').value, from=id('tr-from').value, to=id('tr-to').value, qty=parseInt(id('tr-qty').value)||0;
  if(!key||!from||!to){id('tr-preview').textContent='部品・移動元・移動先を選択してください';return;}
  const p=parts[key], fq=(p.locs||{})[from]||0, tq=(p.locs||{})[to]||0;
  id('tr-preview').textContent=`${from}: ${fq}→${Math.max(0,fq-qty)}　${to}: ${tq}→${tq+qty}`;
}
function doTransfer(){
  const key=id('tr-part').value, from=id('tr-from').value, to=id('tr-to').value, qty=parseInt(id('tr-qty').value)||0;
  if(!key||!from||!to){toast('部品・移動元・移動先を選択してください');return;}
  if(from===to){toast('移動元と移動先が同じです');return;}
  if(qty<=0){toast('数量を入力してください');return;}
  const p=parts[key], fq=(p.locs||{})[from]||0;
  if(qty>fq){toast(`${from}の在庫が不足（現在: ${fq}）`);return;}
  const tq=(p.locs||{})[to]||0;
  const upd={}; upd[`parts/${key}/locs/${from}`]=fq-qty; upd[`parts/${key}/locs/${to}`]=tq+qty; upd[`parts/${key}/updatedAt`]=Date.now();
  db.ref().update(upd);
  addHist('move',key,p.name,`${from}→${to} ${qty}個移動`);
  toast(`✅ ${from}→${to} ${qty}個`);
  closeOv('ov-transfer');
}

// ── Part History ──
function openPartHist(key){
  const p=parts[key]; if(!p)return;
  openPartKey=key;
  id('phist-title').textContent=`📋 ${p.name} の変更履歴`;
  open_('ov-phist');
  renderPartHistModal();
}
function renderPartHistModal(){
  const items=hist.filter(h=>h.partKey===openPartKey||h.key===openPartKey).slice(0,10);
  if(!items.length){
    id('phist-body').innerHTML=`<div style="text-align:center;padding:24px;color:var(--muted);">履歴はまだありません<br><small>全履歴件数: ${hist.length}</small></div>`;
    return;
  }
  id('phist-body').innerHTML=items.map(h=>`
    <div class="part-hist-item hi-${h.type}">
      <div class="phi-top">
        <span class="phi-type type-${h.type||'edit'}">${TYPE_LABELS[h.type]||h.type}</span>
        <span style="color:var(--muted);font-size:12px;">${fmtDate(h.ts)}</span>
      </div>
      <div class="phi-detail">${esc(h.detail||'')}</div>
    </div>`).join('');
}

// ── Global History ──
function addHist(type,key,name,detail){
  db.ref('history').push({type, partKey:key, name, detail, ts:Date.now()});
}
function renderHist(){
  const list=id('hist-list');
  if(!hist.length){list.innerHTML='<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px;">履歴はまだありません</div>';return;}
  list.innerHTML=hist.map(h=>`<div class="hi hi-${h.type}"><div class="hi-top"><span class="hi-name">${esc(h.name||'')}</span><span class="hi-time">${fmtDate(h.ts)}</span></div><div class="hi-detail">[${TYPE_LABELS[h.type]||h.type}] ${esc(h.detail||'')}</div></div>`).join('');
}
function toggleHist(){ id('hist-panel').classList.toggle('open'); }

// ── CSV Import ──
let csvImportData = null;

function handleCSVImport(e){
  const file = e.target.files[0]; if(!file) return;
  toast('📂 CSVを読み込み中...');
  const reader = new FileReader();
  reader.onerror = function(){ toast('ファイルの読み込みに失敗しました'); };
  reader.onload = function(ev){
    try {
      let text = ev.target.result;
      // BOM除去
      if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
      csvImportData = parseImportCSV(text);
      if(!csvImportData || Object.keys(csvImportData).length===0){
        toast('CSVの解析に失敗しました（列が見つかりません）');
        return;
      }
      const count = Object.keys(csvImportData).length;
      id('csv-preview').innerHTML = `
        <strong>インポート内容：</strong><br>
        部品種類: <strong>${count} 種</strong><br>
        対象保管場所: シンワ倉庫・アラン・ゆーや・しゅん・たくや<br><br>
        <strong>サンプル（最初の3件）：</strong><br>
        ${Object.values(csvImportData).slice(0,3).map(p=>
          `[${p.no}] ${p.name} / 合計:${LOCS.reduce((s,l)=>s+(p.locs[l]||0),0)}`
        ).join('<br>')}
      `;
      open_('ov-csv');
    } catch(err) {
      toast('エラー: ' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

function parseImportCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length < 2) return null;

  // ヘッダー（カンマで単純分割）
  const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  const nameIdx = headers.findIndex(h=>h.includes('物品名'));
  const locIdx  = headers.findIndex(h=>h.includes('保管場所'));
  const qtyIdx  = headers.findIndex(h=>h==='数量'||h.includes('数量'));
  const noIdx   = headers.findLastIndex(h=>h.includes('部品番号'));

  if(nameIdx<0||locIdx<0||qtyIdx<0) return null;

  const map = {};
  for(let i=1;i<lines.length;i++){
    const cols = lines[i].split(',');
    if(cols.length < Math.max(nameIdx,locIdx,qtyIdx)+1) continue;
    const name = cols[nameIdx].trim().replace(/^"|"$/g,'');
    const loc  = cols[locIdx].trim().replace(/^"|"$/g,'');
    const qty  = parseInt(cols[qtyIdx])||0;
    const no   = noIdx>=0 ? cols[noIdx].trim().replace(/^"|"$/g,'') : '';
    if(!name || !LOCS.includes(loc)) continue;

    const key = no || name;
    if(!map[key]){
      map[key] = { no, name, locs:{シンワ倉庫:0,アラン:0,ゆーや:0,しゅん:0,たくや:0}, updatedAt:Date.now(), createdAt:Date.now() };
    }
    map[key].locs[loc] = qty;
  }
  return map;
}

async function doCSVImport(){
  if(!csvImportData){ toast('データがありません'); return; }
  id('csv-import-btn').disabled=true;
  id('csv-import-btn').textContent='インポート中...';

  const entries = Object.values(csvImportData);
  let done=0;

  // 既存部品を部品番号/名前でマップ
  const existingMap={};
  Object.entries(parts).forEach(([k,p])=>{
    if(p.no) existingMap[p.no]=k;
    existingMap[p.name]=k;
  });

  for(const p of entries){
    const existKey = existingMap[p.no]||existingMap[p.name];
    if(existKey){
      await db.ref('parts/'+existKey).update({locs:p.locs, updatedAt:Date.now()});
    } else {
      await db.ref('parts').push(p);
    }
    done++;
    if(done%50===0) id('csv-import-btn').textContent=`インポート中... ${done}/${entries.length}`;
  }

  addHist('add','import','CSVインポート',`${entries.length}件インポート完了`);
  toast(`✅ ${entries.length}件インポートしました`);
  id('csv-import-btn').disabled=false;
  id('csv-import-btn').textContent='インポート実行';
  closeOv('ov-csv');
  csvImportData=null;
}

// ── Export ──
function getExportRows(){
  return Object.values(parts).map(p=>{
    const locs=p.locs||{}, total=LOCS.reduce((s,l)=>s+(locs[l]||0),0);
    const row={'部品番号':p.no||'','部品名':p.name||''};
    LOCS.forEach(l=>{row[l]=locs[l]||0;}); row['合計']=total; row['最終更新']=fmtDate(p.updatedAt);
    return row;
  });
}
function exportCSV(){
  const rows=getExportRows(); if(!rows.length){toast('データがありません');return;}
  const headers=Object.keys(rows[0]);
  const csv=[headers.join(','),...rows.map(r=>headers.map(h=>{const v=String(r[h]??'');return v.includes(',')?`"${v}"`:v;}).join(','))].join('\n');
  dl(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}),`部品在庫_${today()}.csv`);
  toast('📄 CSVをダウンロードしました');
}
function exportExcel(){
  const rows=getExportRows(); if(!rows.length){toast('データがありません');return;}
  const ws=XLSX.utils.json_to_sheet(rows); ws['!cols']=[10,20,10,10,10,10,10,10,16].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'部品在庫');
  if(hist.length){
    const hd=hist.slice(0,500).map(h=>({'日時':fmtDate(h.ts),'操作':TYPE_LABELS[h.type]||h.type,'部品名':h.name||'','詳細':h.detail||''}));
    const wsH=XLSX.utils.json_to_sheet(hd); wsH['!cols']=[16,8,20,30].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,wsH,'操作履歴');
  }
  XLSX.writeFile(wb,`部品在庫_${today()}.xlsx`);
  toast('📊 Excelをダウンロードしました');
}

// ── Helpers ──
function id(x){return document.getElementById(x);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(ts){if(!ts)return'—';const d=new Date(ts);return d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function today(){const d=new Date();return`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}
function open_(ovId){id(ovId).classList.add('open');}
function closeOv(ovId,e){
  if(!e||e.target===id(ovId)){
    id(ovId).classList.remove('open');
    if(ovId==='ov-phist') openPartKey=null;
  }
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);}
function showErr(msg){const e=id('setup-err');e.textContent=msg;e.style.display='block';}
let _tt;
function toast(msg){const t=id('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2500);}
</script>
